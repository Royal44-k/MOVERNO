<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="80mm" viewBox="0 0 180 80">
  <title>MOVERNO Motion Contour V2</title>
  <desc>Test strip only. Default edge width is 0.60 mm. 0.35 and 0.45 mm are supplier capability tests.</desc>
  <rect x="0" y="0" width="180" height="80" fill="#FFFFFF"/>
  <text x="8" y="9" font-size="5.5" font-weight="700" font-family="Arial, Microsoft YaHei, sans-serif">MOVERNO - FOIL EDGE LINE / GAP TEST</text>
  <g id="EDGE_LINE_TEST"><path d="M 42 22 C 72 11 103 33 134 22" fill="none" stroke="#000000" stroke-width="0.35"/><text x="8" y="24.5" font-size="5" font-family="Arial, Microsoft YaHei, sans-serif">0.35 mm edge</text><path d="M 42 42 C 72 31 103 53 134 42" fill="none" stroke="#000000" stroke-width="0.45"/><text x="8" y="44.5" font-size="5" font-family="Arial, Microsoft YaHei, sans-serif">0.45 mm edge</text><path d="M 42 62 C 72 51 103 73 134 62" fill="none" stroke="#000000" stroke-width="0.6"/><text x="8" y="64.5" font-size="5" font-family="Arial, Microsoft YaHei, sans-serif">0.6 mm edge</text></g>
  <g id="NEGATIVE_GAP_TEST"><rect x="145" y="15" width="2" height="50" fill="#000000"/><rect x="147.35" y="15" width="2" height="50" fill="#000000"/><text x="144" y="72" font-size="4" font-family="Arial, Microsoft YaHei, sans-serif">0.35</text><rect x="156" y="15" width="2" height="50" fill="#000000"/><rect x="158.45" y="15" width="2" height="50" fill="#000000"/><text x="155" y="72" font-size="4" font-family="Arial, Microsoft YaHei, sans-serif">0.45</text><rect x="167" y="15" width="2" height="50" fill="#000000"/><rect x="169.6" y="15" width="2" height="50" fill="#000000"/><text x="166" y="72" font-size="4" font-family="Arial, Microsoft YaHei, sans-serif">0.6</text></g>
</svg>
